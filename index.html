<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dienstplan Sarah</title>
  <meta name="description" content="Arbeitszeitplaner: Dienste, VZ und Termine pro Woche, Ist-Stunden gegen 39 h Soll.">
  <meta name="theme-color" content="#FBF8F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dienstplan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <div class="statusbar-cover"></div>

    <!-- Woche -->
    <section class="screen" id="screen-week" data-screen="week">
      <div class="week-head" id="week-head"></div>
      <div class="scroll" id="week-body"></div>
    </section>

    <!-- Termine -->
    <section class="screen scroll" id="screen-termine" data-screen="termine" hidden></section>

    <!-- Übersicht -->
    <section class="screen scroll" id="screen-uebersicht" data-screen="uebersicht" hidden></section>

    <!-- Einstellungen -->
    <section class="screen scroll" id="screen-einstellungen" data-screen="einstellungen" hidden></section>

    <!-- Tab-Leiste -->
    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-tab="week" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span>Woche</span>
      </button>
      <button class="tab" data-tab="termine" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        <span>Termine</span>
      </button>
      <button class="tab" data-tab="uebersicht" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
        <span>Übersicht</span>
      </button>
      <button class="tab" data-tab="einstellungen" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
        <span>Einstellungen</span>
      </button>
    </nav>

    <!-- Bottom-Sheet -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
      <div class="sheet-grabber" data-action="sheet-close"></div>
      <div class="sheet-content" id="sheet-content"></div>
    </div>

    <!-- Hinweis -->
    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/calc.js"></script>
  <script src="./js/ui.js"></script>
</body>
</html>
